<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sir bravin music</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial,sans-serif}
    body{background:#0f0f0f;color:#f1f1f1;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px 16px 40px}
    .app-wrapper{max-width:900px;width:100%;background:#181818;border-radius:32px;padding:24px 28px 32px;border:1px solid #2a2a2a}
    .top-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-bottom:20px;border-bottom:1px solid #2a2a2a;margin-bottom:20px}
    .logo-text{font-size:24px;font-weight:700} .logo-text span{color:#aaa;font-weight:300}
    .search-box{flex:1 1 300px;display:flex;align-items:center;background:#222;border-radius:40px;padding:0 6px 0 20px;border:1px solid #3a3a3a}
    .search-box input{flex:1;background:transparent;border:none;padding:14px 6px;color:#fff;font-size:16px;outline:none}
    .search-box button{background:transparent;border:none;color:#aaa;font-size:18px;padding:10px 16px;cursor:pointer}

    .grid{display:flex;flex-direction:column;gap:20px}
    .media-card{background:#1f1f1f;border-radius:20px;overflow:hidden;border:1px solid #2a2a2a}
    .card-thumb{width:100%;aspect-ratio:16/9;background:#000;position:relative;overflow:hidden}
    .card-thumb img.thumb-img{width:100%;height:100%;object-fit:cover}
    .card-thumb iframe{width:100%;height:100%;border:0;display:none}
    .play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.25)}
    .play-btn{width:68px;height:68px;border-radius:50%;background:rgba(0,0,0,0.7);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;transition:0.2s}
    .play-btn:hover{transform:scale(1.08);background:#ff0033;border-color:#ff0033}
    .duration-badge{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.85);padding:3px 7px;border-radius:6px;font-size:12px}
    .card-info{display:flex;gap:12px;padding:12px 14px}
    .channel-avatar{width:40px;height:40px;border-radius:50%;background:#2a2a2a;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:700}
    .channel-avatar img{width:100%;height:100%;object-fit:cover}
    .card-title{font-weight:600;font-size:16px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .card-artist{color:#aaa;font-size:14px;margin-top:4px}
    .card-controls{display:flex;gap:8px;padding:0 14px 14px}
    .btn-ctrl{flex:1;background:#2a2a2a;border:1px solid #333;color:#fff;padding:10px;border-radius:40px;cursor:pointer;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-ctrl.play{background:#ff0033;border-color:#ff0033} .btn-ctrl:hover{opacity:0.9}
    .loader{text-align:center;padding:40px;color:#888}
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="top-bar">
    <div class="logo-text">SIR BRAVIN<span> MUSIC</span></div>
    <div class="search-box">
      <input id="searchInput" placeholder="Search songs, artists...">
      <button id="searchBtn"><i class="fas fa-search"></i></button>
    </div>
  </div>
  <div class="grid" id="mediaGrid"><div class="loader">Type a song and press Enter - demo data below</div></div>
</div>

<script>
  const grid = document.getElementById('mediaGrid');
  // DEMO DATA - replace with YouTube Data API v3 search results lawfully
  const demoVideos = [
    {id:'dQw4w9WgXcQ', title:'DJ Afro Latest Mix 2026', channel:'Trova adits', thumb:'https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg', avatar:'T'},
    {id:'jNQXAC9IVRw', title:'Auto Clearance - Everything Must Go Mix', channel:'Van Life Music', thumb:'https://img.youtube.com/vi/jNQXAC9IVRw/hqdefault.jpg', avatar:'V'},
  ];

  function render(videos){
    grid.innerHTML = videos.map(v=>`
      <div class="media-card" data-id="${v.id}">
        <div class="card-thumb" id="thumb-${v.id}">
          <img class="thumb-img" src="${v.thumb}">
          <iframe id="player-${v.id}" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
          <div class="play-overlay" id="overlay-${v.id}">
            <div class="play-btn" onclick="togglePlay('${v.id}')"><i class="fas fa-play" id="icon-${v.id}"></i></div>
          </div>
          <span class="duration-badge">▶️ YouTube</span>
        </div>
        <div class="card-info">
          <div class="channel-avatar">${v.avatar}</div>
          <div style="flex:1;min-width:0">
            <div class="card-title">${v.title}</div>
            <div class="card-artist">${v.channel} • 1.4M views • 2 months ago</div>
          </div>
        </div>
        <div class="card-controls">
          <button class="btn-ctrl play" id="btn-${v.id}" onclick="togglePlay('${v.id}')">
            <i class="fas fa-play"></i> <span>Play</span>
          </button>
          <button class="btn-ctrl" onclick="window.open('https://www.youtube.com/watch?v=${v.id}','_blank')">
            <i class="fab fa-youtube"></i> Open
          </button>
        </div>
      </div>
    `).join('');
  }

  let currentPlaying = null;

  function togglePlay(id){
    const player = document.getElementById(`player-${id}`);
    const thumbImg = document.querySelector(`#thumb-${id} .thumb-img`);
    const overlay = document.getElementById(`overlay-${id}`);
    const btn = document.getElementById(`btn-${id}`);
    const icon = document.getElementById(`icon-${id}`);

    // pause if same video is playing
    if(currentPlaying === id){
      player.style.display = 'none';
      player.src = '';
      thumbImg.style.display = 'block';
      overlay.style.display = 'flex';
      btn.innerHTML = '<i class="fas fa-play"></i> <span>Play</span>';
      btn.classList.add('play');
      icon.className = 'fas fa-play';
      currentPlaying = null;
      return;
    }

    // pause previous
    if(currentPlaying){
      const prevPlayer = document.getElementById(`player-${currentPlaying}`);
      const prevThumb = document.querySelector(`#thumb-${currentPlaying} .thumb-img`);
      const prevOverlay = document.getElementById(`overlay-${currentPlaying}`);
      const prevBtn = document.getElementById(`btn-${currentPlaying}`);
      const prevIcon = document.getElementById(`icon-${currentPlaying}`);
      if(prevPlayer){ prevPlayer.style.display='none'; prevPlayer.src=''; }
      if(prevThumb) prevThumb.style.display='block';
      if(prevOverlay) prevOverlay.style.display='flex';
      if(prevBtn){ prevBtn.innerHTML='<i class="fas fa-play"></i> <span>Play</span>'; prevBtn.classList.add('play'); }
      if(prevIcon) prevIcon.className='fas fa-play';
    }

    // play new - lawful embed autoplay
    player.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
    player.style.display = 'block';
    thumbImg.style.display = 'none';
    overlay.style.display = 'none';
    btn.innerHTML = '<i class="fas fa-pause"></i> <span>Pause</span>';
    btn.classList.remove('play');
    btn.style.background = '#444';
    currentPlaying = id;
  }

  render(demoVideos);

  // hook search - you should connect YouTube Data API v3 here
  document.getElementById('searchBtn').onclick = () => render(demoVideos);
</script>
</body>
</html>
