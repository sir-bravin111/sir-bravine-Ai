<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sir bravin· music & video</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Roboto',Arial,sans-serif}
    body{background:#0f0f0f;color:#f1f1f1;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px 16px 40px}
   .app-wrapper{max-width:1200px;width:100%;background:#181818;border-radius:32px;padding:24px 28px 32px;box-shadow:0 20px 40px rgba(0,0,0,0.8);border:1px solid #2a2a2a}
   .top-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px 12px;padding-bottom:20px;border-bottom:1px solid #2a2a2a;margin-bottom:28px}
   .logo-area{display:flex;align-items:center;gap:10px}
   .logo-icon{font-size:32px;color:#ff0033;background:#1a1a1a;padding:6px 10px;border-radius:40px;box-shadow:0 0 0 1px #2a2a2a}
   .logo-text{font-size:24px;font-weight:700;letter-spacing:-0.5px;background:linear-gradient(135deg,#ff0033,#ff4d4d);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
   .logo-text span{font-weight:300;-webkit-text-fill-color:#aaa}
   .search-box{flex:1 1 320px;display:flex;align-items:center;background:#222;border-radius:40px;padding:0 6px 0 20px;border:1px solid #3a3a3a;transition:0.2s}
   .search-box:focus-within{border-color:#ff0033;box-shadow:0 0 0 2px rgba(255,0,51,0.3)}
   .search-box input{flex:1;background:transparent;border:none;padding:14px 6px;color:#f1f1f1;font-size:16px;outline:none;min-width:100px}
   .search-box button{background:transparent;border:none;color:#aaa;font-size:20px;padding:10px 18px;cursor:pointer;border-radius:40px}
   .search-box button:hover{color:#fff;background:#333}
   .hero-section{display:flex;flex-wrap:wrap;gap:24px 32px;background:#1e1e1e;border-radius:28px;padding:24px 28px;margin-bottom:36px;border:1px solid #2c2c2c;align-items:center}
   .artist-card{display:flex;align-items:center;gap:18px;flex:1 1 200px}
   .artist-picture{width:80px;height:80px;border-radius:50%;background:linear-gradient(145deg,#2a2a2a,#1a1a1a);display:flex;align-items:center;justify-content:center;font-size:42px;color:#ff4d4d;border:2px solid #3a3a3a;flex-shrink:0}
   .section-title{font-size:20px;font-weight:500;margin-bottom:18px;display:flex;align-items:center;gap:12px;border-left:4px solid #ff0033;padding-left:16px}
   .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px 20px;margin-top:6px}
   .media-card{background:#1f1f1f;border-radius:20px;overflow:hidden;border:1px solid #2a2a2a;transition:0.25s;display:flex;flex-direction:column}
   .media-card:hover{transform:translateY(-6px);border-color:#ff4d4d;box-shadow:0 12px 28px rgba(255,0,51,0.15)}
   .card-thumb{width:100%;aspect-ratio:16/9;background:#2a2a2a;position:relative;overflow:hidden}
   .card-thumb img{width:100%;height:100%;object-fit:cover}
   .card-thumb.type-tag{position:absolute;bottom:10px;right:12px;background:#0f0f0fcc;backdrop-filter:blur(4px);padding:4px 12px;border-radius:30px;font-size:12px;font-weight:600;color:#eee;border:1px solid #3a3a3a}
   .card-body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px}
   .card-title{font-weight:600;font-size:16px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
   .card-artist{color:#aaa;font-size:13px}
   .card-meta{display:flex;gap:12px;font-size:12px;color:#888}
   .card-actions{display:flex;gap:8px;margin-top:12px;border-top:1px solid #2c2c2c;padding-top:14px}
   .btn-download{background:#ff0033;border:none;color:white;font-weight:600;padding:8px 16px;border-radius:40px;font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;transition:0.2s;flex:1;justify-content:center}
   .btn-download:hover{background:#cc0028}
   .btn-download.secondary{background:#2a2a2a}
   .btn-download.secondary:hover{background:#3a3a3a}
   .btn-download.loading{opacity:0.6;pointer-events:none}
   .footer-note{margin-top:32px;text-align:center;color:#555;font-size:13px;border-top:1px solid #252525;padding-top:22px}
   .loader{text-align:center;grid-column:1/-1;padding:40px;color:#888}
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="top-bar">
    <div class="logo-area">
      <div class="logo-icon"><i class="fab fa-youtube"></i></div>
      <div class="logo-text">SIR BRAVIN<span>DOWNLOADER</span></div>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search songs, artists, videos...">
      <button id="searchBtn"><i class="fas fa-search"></i></button>
    </div>
  </div>

  <div class="hero-section">
    <div class="artist-card">
      <div class="artist-picture"><i class="fas fa-fire"></i></div>
      <div>
        <div style="font-size:18px;font-weight:600" id="heroArtist">Search anything</div>
        <div style="font-size:13px;color:#aaa" id="heroSub">Real sir bravin downloader - give us feed back</div>
      </div>
    </div>
  </div>

  <div class="section-title"><i class="fas fa-headphones-alt"></i> Results</div>
  <div class="grid" id="mediaGrid">
    <div class="loader"><i class="fas fa-music"></i><br><br>Type a song and press Enter</div>
  </div>

  <div class="footer-note">AURA-BXMD • High quality audio/video</div>
</div>

<script>
  // ===== YOUR CLEAN APIS - NO KEY =====
  const AUDIO_APIS = [
    url => `https://apis.davidcyriltech.my.id/download/ytmp3?url=${encodeURIComponent(url)}`,
    url => `https://www.dark-yasiya-api.site/download/ytmp3?url=${encodeURIComponent(url)}`,
    url => `https://api.dreaded.site/api/ytdl/audio?url=${encodeURIComponent(url)}`
  ];

  const VIDEO_APIS = [
    url => `https://apiziaul.vercel.app/api/downloader/ytmp4?url=${encodeURIComponent(url)}`,
    url => `https://apiziaul.vercel.app/api/downloader/ytmp4?url=${encodeURIComponent(url)}`,
    url => `https://api.dreaded.site/api/ytdl/video?url=${encodeURIComponent(url)}`
  ];

  // YouTube search API (key-free)
  const SEARCH_APIS = [
    q => `https://apis.davidcyriltech.my.id/youtube/search?query=${encodeURIComponent(q)}`,
    q => `https://www.dark-yasiya-api.site/search/yts?query=${encodeURIComponent(q)}`
  ];

  const grid = document.getElementById('mediaGrid');
  const searchInput = document.getElementById('searchInput');
  const heroArtist = document.getElementById('heroArtist');
  const heroSub = document.getElementById('heroSub');

  async function searchYouTube(query) {
    grid.innerHTML = `<div class="loader"><i class="fas fa-spinner fa-spin"></i><br><br>Searching YouTube for "${query}"...</div>`;
    for (let apiFn of SEARCH_APIS) {
      try {
        const res = await fetch(apiFn(query));
        const data = await res.json();
        const videos = data.result || data.results || data.videos || data;
        if (Array.isArray(videos) && videos.length > 0) {
          return videos.slice(0, 12);
        }
        if (data.result && Array.isArray(data.result.videos)) return data.result.videos.slice(0,12);
      } catch(e){ continue; }
    }
    return null;
  }

  async function getDownloadLink(youtubeUrl, type) {
    const apis = type === 'audio'? AUDIO_APIS : VIDEO_APIS;
    for (let apiFn of apis) {
      try {
        const res = await fetch(apiFn(youtubeUrl));
        const data = await res.json();
        const r = data.result || data;
        const link = r.download_url || r.downloadUrl || r.url || data.downloadUrl || data.url;
        if (link) return { url: link, title: r.title || 'download' };
      } catch(e){ continue; }
    }
    return null;
  }

  function renderCards(videos) {
    if (!videos || videos.length === 0) {
      grid.innerHTML = `<div class="loader">No results found</div>`;
      return;
    }
    heroArtist.innerText = videos[0].author?.name || videos[0].channel || 'YouTube Results';
    heroSub.innerText = `${videos.length} results found`;

    grid.innerHTML = videos.map(v => {
      const thumb = v.thumbnail || v.thumbnails?.[0]?.url || `https://img.youtube.com/vi/${v.videoId || v.id}/hqdefault.jpg`;
      const title = v.title || v.name || 'Untitled';
      const channel = v.author?.name || v.channel || v.author || 'YouTube';
      const duration = v.timestamp || v.duration || v.time || '';
      const videoId = v.videoId || v.id || '';
      const url = v.url || `https://www.youtube.com/watch?v=${videoId}`;

      return `
        <div class="media-card">
          <div class="card-thumb">
            <img src="${thumb}" loading="lazy">
            <span class="type-tag">${duration}</span>
          </div>
          <div class="card-body">
            <div class="card-title">${title}</div>
            <div class="card-artist"><i class="fas fa-user-circle"></i> ${channel}</div>
            <div class="card-meta"><i class="fas fa-link"></i> youtube.com/watch?v=${videoId.slice(0,6)}...</div>
            <div class="card-actions">
              <button class="btn-download" onclick="downloadNow('${url}', 'audio', this)"><i class="fas fa-music"></i> MP3</button>
              <button class="btn-download secondary" onclick="downloadNow('${url}', 'video', this)"><i class="fas fa-video"></i> MP4</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  async function downloadNow(youtubeUrl, type, btn) {
    const original = btn.innerHTML;
    btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Loading`;
    btn.classList.add('loading');
    try {
      const result = await getDownloadLink(youtubeUrl, type);
      if (!result) throw new Error('Server busy');

      // Trigger real download
      const a = document.createElement('a');
      a.href = result.url;
      a.download = `${result.title}.${type === 'audio'? 'mp3' : 'mp4'}`;
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      a.remove();

      btn.innerHTML = `<i class="fas fa-check"></i> Done`;
      setTimeout(()=> { btn.innerHTML = original; btn.classList.remove('loading'); }, 2000);
    } catch (e) {
      btn.innerHTML = `<i class="fas fa-times"></i> Failed`;
      alert('Download failed, try another server. Error: ' + e.message);
      setTimeout(()=> { btn.innerHTML = original; btn.classList.remove('loading'); }, 2000);
    }
  }

  async function doSearch() {
    const q = searchInput.value.trim();
    if (!q) return;
    const results = await searchYouTube(q);
    if (results) renderCards(results);
    else grid.innerHTML = `<div class="loader">API limit reached. Try again later or change keyword.</div>`;
  }

  document.getElementById('searchBtn').addEventListener('click', doSearch);
  searchInput.addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });
</script>
</body>
</html>
