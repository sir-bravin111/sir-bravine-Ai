<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 SongHub · albums & singers</title>
  <!-- Font Awesome for icons (similar to YouTube style) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
    }

    body {
      background-color: #0f0f0f;
      color: #f1f1f1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* main card – looks like a YouTube downloader panel */
    .downloader-card {
      max-width: 1000px;
      width: 100%;
      background: #1e1e1e;
      border-radius: 28px;
      padding: 30px 30px 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px #3a3a3a;
      transition: 0.2s;
      margin-bottom: 30px;
    }

    /* header: youtube-dl style */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      border-bottom: 1px solid #333;
      padding-bottom: 18px;
    }

    .header i {
      font-size: 32px;
      color: #ff0033;
      background: #1e1e1e;
      padding: 8px;
      border-radius: 50%;
      box-shadow: 0 0 0 1px #3a3a3a;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 500;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #f1f1f1 60%, #aaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header h1 span {
      font-weight: 300;
      color: #aaa;
      -webkit-text-fill-color: #aaa;
      background: none;
    }

    .header .badge {
      margin-left: auto;
      background: #2a2a2a;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 14px;
      color: #ccc;
      border: 1px solid #3d3d3d;
    }

    /* search / input area – like "paste URL" but for singer/album */
    .input-area {
      background: #252525;
      border-radius: 60px;
      padding: 6px 6px 6px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #3d3d3d;
      transition: 0.2s;
      margin-bottom: 25px;
    }

    .input-area:focus-within {
      border-color: #ff0033;
      box-shadow: 0 0 12px rgba(255, 0, 51, 0.2);
    }

    .input-area i {
      color: #888;
      font-size: 18px;
    }

    .input-area input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 16px 0;
      color: #f1f1f1;
      font-size: 16px;
      outline: none;
    }

    .input-area input::placeholder {
      color: #6a6a6a;
      font-weight: 300;
      letter-spacing: 0.3px;
    }

    .input-area button {
      background: #ff0033;
      border: none;
      color: white;
      padding: 12px 32px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: 0.15s;
      letter-spacing: 0.5px;
      background: #cc0000;
      box-shadow: 0 4px 10px rgba(255, 0, 51, 0.3);
    }

    .input-area button:hover {
      background: #ff1a1a;
      transform: scale(1.02);
      box-shadow: 0 6px 14px rgba(255, 0, 51, 0.4);
    }

    .input-area button i {
      color: white;
      font-size: 16px;
    }

    /* quick filters (like youtube categories) */
    .chip-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      margin-bottom: 28px;
      padding: 4px 0;
    }

    .chip {
      background: #2a2a2a;
      padding: 8px 20px;
      border-radius: 40px;
      font-size: 14px;
      color: #ccc;
      border: 1px solid #3d3d3d;
      transition: 0.1s;
      cursor: default;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chip i {
      color: #ff0033;
      font-size: 14px;
    }

    .chip.active {
      background: #3a1a1a;
      border-color: #ff0033;
      color: white;
    }

    /* grid – singers / albums cards */
    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 24px 20px;
      margin-top: 6px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 20px;
      overflow: hidden;
      transition: 0.2s;
      border: 1px solid #2e2e2e;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.6);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: #4a4a4a;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.8);
    }

    .card-img {
      height: 170px;
      background: #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      color: #555;
      position: relative;
      background-size: cover;
      background-position: center;
    }

    /* mock album art with gradient */
    .card-img .art-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      background: radial-gradient(circle at 20% 30%, #3a3a3a, #151515);
      color: #5a5a5a;
    }

    .card-body {
      padding: 16px 16px 18px;
    }

    .card-body h3 {
      font-size: 17px;
      font-weight: 500;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-body .artist {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-body .artist i {
      color: #ff0033;
      font-size: 12px;
    }

    .card-body .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #777;
      border-top: 1px solid #2a2a2a;
      padding-top: 10px;
      margin-top: 6px;
    }

    .card-body .meta .album-badge {
      background: #2a2a2a;
      padding: 2px 12px;
      border-radius: 30px;
      font-size: 11px;
      color: #bbb;
      border: 1px solid #3a3a3a;
    }

    .btn-download {
      background: transparent;
      border: 1px solid #3d3d3d;
      color: #ddd;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: default;
      transition: 0.1s;
    }

    .btn-download i {
      color: #ff0033;
    }

    .btn-download:hover {
      background: #2a2a2a;
      border-color: #ff0033;
    }

    /* footer note */
    .footer-note {
      margin-top: 30px;
      color: #4a4a4a;
      font-size: 14px;
      text-align: center;
      border-top: 1px solid #282828;
      padding-top: 24px;
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .footer-note span i {
      color: #ff0033;
      margin: 0 4px;
    }

    /* responsive */
    @media (max-width: 650px) {
      .downloader-card {
        padding: 18px;
      }
      .input-area {
        flex-wrap: wrap;
        background: transparent;
        border: none;
        padding: 0;
        gap: 12px;
      }
      .input-area input {
        background: #252525;
        padding: 14px 20px;
        border-radius: 60px;
        border: 1px solid #3d3d3d;
        width: 100%;
      }
      .input-area button {
        width: 100%;
        justify-content: center;
      }
      .header h1 {
        font-size: 20px;
      }
      .chip-bar {
        gap: 8px;
      }
      .chip {
        font-size: 12px;
        padding: 6px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="downloader-card">
    <!-- header: YouTube downloader style -->
    <div class="header">
      <i class="fab fa-youtube"></i>
      <h1>Song<span>Hub</span></h1>
      <div class="badge"><i class="fas fa-download"></i>  MP3 · ALBUM</div>
    </div>

    <!-- input: looks like "paste URL" but we use it for singer/song -->
    <div class="input-area">
      <i class="fas fa-microphone-alt"></i>
      <input type="text" id="searchInput" placeholder="Search singer, song or album ..." value="Taylor Swift">
      <button id="searchBtn"><i class="fas fa-arrow-right"></i>  Get songs</button>
    </div>

    <!-- chip filters (like YouTube categories) -->
    <div class="chip-bar">
      <div class="chip active"><i class="fas fa-fire"></i> Trending</div>
      <div class="chip"><i class="fas fa-guitar"></i> Pop</div>
      <div class="chip"><i class="fas fa-headphones"></i> Rock</div>
      <div class="chip"><i class="fas fa-star"></i> Top albums</div>
      <div class="chip"><i class="fas fa-user"></i> Artists</div>
    </div>

    <!-- result grid: singers / songs / albums -->
    <div id="resultContainer" class="result-grid">
      <!-- cards will be injected by javascript (using different APIs / mock data) -->
    </div>

    <!-- small status (like "downloader" style) -->
    <div style="margin-top: 28px; font-size: 14px; color: #4a4a4a; display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; border-top: 1px solid #282828; padding-top: 20px;">
      <span><i class="fas fa-check-circle" style="color: #2e9b4c;"></i> 高品质 320kbps</span>
      <span><i class="fas fa-album"></i>  Album art included</span>
      <span><i class="fas fa-download"></i>  Direct download (simulated)</span>
    </div>
  </div>

  <!-- footer -->
  <div class="footer-note">
    <span><i class="fas fa-music"></i>  using different APIs · singers & albums</span>
    <span><i class="fas fa-headphones"></i>  SONG ALBUM · 2026</span>
  </div>

  <script>
    (function() {
      // ---------- MOCK DATA (simulates multiple APIs) ----------
      // Each card represents a "song" with singer & album
      const songLibrary = [
        { id: 1, title: "Anti-Hero", artist: "Taylor Swift", album: "Midnights", year: "2022", genre: "Pop" },
        { id: 2, title: "As It Was", artist: "Harry Styles", album: "Harry's House", year: "2022", genre: "Pop" },
        { id: 3, title: "Blinding Lights", artist: "The Weeknd", album: "After Hours", year: "2020", genre: "Synth-pop" },
        { id: 4, title: "Levitating", artist: "Dua Lipa", album: "Future Nostalgia", year: "2020", genre: "Disco-pop" },
        { id: 5, title: "drivers license", artist: "Olivia Rodrigo", album: "SOUR", year: "2021", genre: "Pop" },
        { id: 6, title: "Bad Guy", artist: "Billie Eilish", album: "WHEN WE ALL FALL ASLEEP, WHERE DO WE GO?", year: "2019", genre: "Electropop" },
        { id: 7, title: "Shallow", artist: "Lady Gaga & Bradley Cooper", album: "A Star Is Born", year: "2018", genre: "Country rock" },
        { id: 8, title: "Old Town Road", artist: "Lil Nas X", album: "7", year: "2019", genre: "Country rap" },
        { id: 9, title: "Watermelon Sugar", artist: "Harry Styles", album: "Fine Line", year: "2019", genre: "Pop rock" },
        { id: 10, title: "Positions", artist: "Ariana Grande", album: "Positions", year: "2020", genre: "R&B" },
        { id: 11, title: "MONTERO", artist: "Lil Nas X", album: "MONTERO", year: "2021", genre: "Pop rap" },
        { id: 12, title: "Peaches", artist: "Justin Bieber", album: "Justice", year: "2021", genre: "R&B" },
        { id: 13, title: "Kiss Me More", artist: "Doja Cat ft. SZA", album: "Planet Her", year: "2021", genre: "Pop" },
        { id: 14, title: "Good 4 U", artist: "Olivia Rodrigo", album: "SOUR", year: "2021", genre: "Pop punk" },
        { id: 15, title: "Save Your Tears", artist: "The Weeknd", album: "After Hours", year: "2020", genre: "Synthwave" },
      ];

      // additional "album" objects for variety (simulate different API)
      const albumCovers = [
        "Midnights", "Harry's House", "After Hours", "Future Nostalgia", 
        "SOUR", "WHEN WE ALL FALL ASLEEP, WHERE DO WE GO?", "A Star Is Born", 
        "7", "Fine Line", "Positions", "MONTERO", "Justice", "Planet Her"
      ];

      // DOM elements
      const container = document.getElementById('resultContainer');
      const searchInput = document.getElementById('searchInput');
      const searchBtn = document.getElementById('searchBtn');

      // helper: random album art color (just for visual)
      function getRandomGradient(seed) {
        const colors = ['#1a2a3a', '#2a1a3a', '#1a3a2a', '#3a2a1a', '#2a2a3a', '#3a1a2a', '#1a2a2a'];
        const c1 = colors[seed % colors.length];
        const c2 = colors[(seed + 3) % colors.length];
        return `radial-gradient(circle at 30% 40%, ${c1}, ${c2})`;
      }

      // render cards based on an array of songs
      function renderSongs(songs) {
        if (!songs || songs.length === 0) {
          container.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #666;">
              <i class="fas fa-music" style="font-size: 48px; opacity: 0.3; display: block; margin-bottom: 16px;"></i>
              <p style="font-size: 18px;">No songs found · try another singer or album</p>
              <p style="font-size: 14px; margin-top: 10px;">🎤 e.g. "Taylor Swift" , "SOUR" , "After Hours"</p>
            </div>
          `;
          return;
        }

        let html = '';
        songs.forEach((song, index) => {
          // build a unique gradient for each card (simulate album art)
          const gradient = getRandomGradient(song.id + index * 3);
          // album name fallback
          const albumName = song.album || 'Unknown Album';
          // short year
          const year = song.year || '2024';
          // use first letter for icon
          const icon = song.artist.charAt(0).toUpperCase();

          html += `
            <div class="card">
              <div class="card-img" style="background: ${gradient}; display: flex; align-items: center; justify-content: center; font-size: 48px; color: rgba(255,255,255,0.3);">
                <span style="background: rgba(0,0,0,0.3); padding: 14px 20px; border-radius: 60px; font-weight: 600; font-size: 28px; color: #eee;">${icon}</span>
                <span style="position: absolute; bottom: 10px; right: 14px; background: rgba(0,0,0,0.6); padding: 2px 12px; border-radius: 30px; font-size: 11px; color: #ccc; backdrop-filter: blur(4px);">${year}</span>
              </div>
              <div class="card-body">
                <h3 title="${song.title}">${song.title}</h3>
                <div class="artist"><i class="fas fa-user"></i> ${song.artist}</div>
                <div class="meta">
                  <span class="album-badge"><i class="fas fa-album"></i> ${albumName.length > 18 ? albumName.slice(0,18)+'…' : albumName}</span>
                  <span class="btn-download"><i class="fas fa-download"></i> DL</span>
                </div>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
      }

      // ---------- FILTER / SEARCH (different APIs simulation) ----------
      function filterSongs(query) {
        if (!query || query.trim() === '') {
          // if empty, show all (like "trending" API)
          return songLibrary.slice(0, 12);
        }

        const q = query.trim().toLowerCase();
        // "API 1" : search by artist, song title, or album
        const results = songLibrary.filter(song => 
          song.title.toLowerCase().includes(q) ||
          song.artist.toLowerCase().includes(q) ||
          song.album.toLowerCase().includes(q)
        );

        // "API 2" : if no results, try a fuzzy match on album or artist (simulate different API)
        if (results.length === 0) {
          // fallback: maybe some albums contain the word
          const fuzzy = songLibrary.filter(song => 
            song.album.toLowerCase().split(' ').some(word => word.includes(q)) ||
            song.artist.toLowerCase().split(' ').some(word => word.includes(q))
          );
          if (fuzzy.length > 0) return fuzzy;
        }

        // "API 3" : if still nothing, return some default (like "related" )
        if (results.length === 0) {
          // return a small set of "suggested" (simulate API response)
          return songLibrary.slice(0, 6);
        }

        return results;
      }

      // perform search and render
      function performSearch() {
        const query = searchInput.value;
        const filtered = filterSongs(query);
        renderSongs(filtered);
      }

      // initial render with default "Taylor Swift" (already in input)
      function initDefault() {
        // set default search to "Taylor Swift" but we already have it in the input
        const defaultQuery = searchInput.value || 'Taylor Swift';
        const results = filterSongs(defaultQuery);
        renderSongs(results);
      }

      // event listeners
      searchBtn.addEventListener('click', performSearch);
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') performSearch();
      });

      // also clicking on chip (just for demo, change search)
      document.querySelectorAll('.chip').forEach((chip, idx) => {
        chip.addEventListener('click', function() {
          // remove active from all
          document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
          this.classList.add('active');
          // set search based on chip text (simulate API category)
          let chipText = this.innerText.trim().toLowerCase();
          if (chipText.includes('trending')) {
            searchInput.value = 'pop';
          } else if (chipText.includes('pop')) {
            searchInput.value = 'Harry Styles';
          } else if (chipText.includes('rock')) {
            searchInput.value = 'rock';
          } else if (chipText.includes('album')) {
            searchInput.value = 'SOUR';
          } else if (chipText.includes('artist')) {
            searchInput.value = 'The Weeknd';
          } else {
            searchInput.value = chipText;
          }
          performSearch();
        });
      });

      // start
      initDefault();
    })();
  </script>
</body>
</html>
