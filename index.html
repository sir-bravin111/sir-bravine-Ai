<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sir bravin · music & video</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    }

    body {
      background: #0b0b0b;
      color: #f1f1f1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 16px 40px;
    }

    .app-wrapper {
      max-width: 1280px;
      width: 100%;
      background: #141414;
      border-radius: 36px;
      padding: 24px 28px 32px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.9);
      border: 1px solid #2a2a2a;
      backdrop-filter: blur(2px);
      transition: 0.25s;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px 12px;
      padding-bottom: 18px;
      border-bottom: 1px solid #2a2a2a;
      margin-bottom: 24px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      font-size: 32px;
      color: #ff0033;
      background: #1a1a1a;
      padding: 6px 10px;
      border-radius: 40px;
      box-shadow: 0 0 0 1px #2a2a2a;
      transition: 0.2s;
    }

    .logo-icon:hover {
      background: #2a2a2a;
      transform: scale(1.03);
    }

    .logo-text {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ff0033, #ff4d4d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-text span {
      font-weight: 300;
      -webkit-text-fill-color: #aaa;
      background: none;
    }

    .search-box {
      flex: 1 1 320px;
      display: flex;
      align-items: center;
      background: #1e1e1e;
      border-radius: 60px;
      padding: 0 6px 0 20px;
      border: 1px solid #333;
      transition: 0.25s;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
    }

    .search-box:focus-within {
      border-color: #ff0033;
      box-shadow: 0 0 0 3px rgba(255, 0, 51, 0.25), inset 0 1px 2px rgba(0,0,0,0.6);
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 14px 6px;
      color: #f1f1f1;
      font-size: 16px;
      outline: none;
      min-width: 100px;
    }

    .search-box input::placeholder {
      color: #777;
      font-weight: 300;
    }

    .search-box button {
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 20px;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 60px;
      transition: 0.2s;
    }

    .search-box button:hover {
      color: #fff;
      background: #2c2c2c;
    }

    .artist-profile {
      display: flex;
      flex-wrap: wrap;
      gap: 28px 36px;
      background: linear-gradient(145deg, #1b1b1b, #131313);
      border-radius: 32px;
      padding: 28px 32px;
      margin-bottom: 36px;
      border: 1px solid #2c2c2c;
      align-items: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.6);
      transition: 0.3s;
    }

    .artist-profile:hover {
      border-color: #ff4d4d55;
      box-shadow: 0 16px 32px rgba(255, 0, 51, 0.08);
    }

    .artist-avatar {
      display: flex;
      align-items: center;
      gap: 20px;
      flex: 1 1 240px;
    }

    .avatar-frame {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      color: #ff4d4d;
      border: 2px solid #3a3a3a;
      flex-shrink: 0;
      box-shadow: 0 0 0 4px #1f1f1f, 0 8px 16px rgba(0,0,0,0.7);
      transition: 0.3s;
    }

    .artist-profile:hover .avatar-frame {
      border-color: #ff0033;
      box-shadow: 0 0 0 4px #1f1f1f, 0 0 20px rgba(255, 0, 51, 0.3);
    }

    .artist-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .artist-name {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .artist-name i {
      color: #ff0033;
      font-size: 22px;
    }

    .artist-badge {
      background: #ff0033;
      padding: 2px 14px;
      border-radius: 40px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #fff;
      box-shadow: 0 2px 8px rgba(255, 0, 51, 0.4);
    }

    .artist-sub {
      color: #aaa;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .artist-sub i {
      color: #ff4d4d;
      font-size: 14px;
    }

    .artist-stats {
      display: flex;
      gap: 16px 28px;
      flex-wrap: wrap;
      margin-left: auto;
      background: #1c1c1c;
      padding: 8px 24px 8px 20px;
      border-radius: 60px;
      border: 1px solid #2e2e2e;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ccc;
      font-size: 14px;
    }

    .stat-item i {
      color: #ff4d4d;
      font-size: 16px;
    }

    .stat-item strong {
      color: #fff;
      font-weight: 600;
    }

    .section-title {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-left: 5px solid #ff0033;
      padding-left: 18px;
      letter-spacing: -0.2px;
    }

    .section-title i {
      color: #ff4d4d;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 26px 22px;
      margin-top: 8px;
    }

    /* featured artists grid */
    .featured-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
      margin: 20px 0 30px;
    }

    .featured-card {
      background: #1a1a1a;
      border-radius: 20px;
      padding: 16px 12px 18px;
      text-align: center;
      border: 1px solid #2a2a2a;
      transition: 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .featured-card:hover {
      transform: translateY(-6px);
      border-color: #ff4d4d;
      box-shadow: 0 12px 24px rgba(255, 0, 51, 0.12);
    }

    .featured-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #ff4d4d;
      border: 2px solid #3a3a3a;
      margin-bottom: 4px;
      transition: 0.3s;
    }

    .featured-card:hover .featured-avatar {
      border-color: #ff0033;
      box-shadow: 0 0 20px rgba(255, 0, 51, 0.25);
    }

    .featured-name {
      font-weight: 600;
      font-size: 15px;
    }

    .featured-tag {
      font-size: 11px;
      color: #888;
      background: #252525;
      padding: 2px 12px;
      border-radius: 20px;
      display: inline-block;
    }

    .featured-play {
      background: #252525;
      border: none;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 40px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #3a3a3a;
    }

    .featured-play:hover {
      background: #ff0033;
      border-color: #ff0033;
      color: #fff;
    }

    .featured-play.playing {
      background: #ff0033;
      border-color: #ff0033;
      color: #fff;
    }

    .media-card {
      background: #1a1a1a;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid #2a2a2a;
      transition: 0.3s cubic-bezier(0.15, 0.75, 0.4, 1);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(2px);
    }

    .media-card:hover {
      transform: translateY(-8px);
      border-color: #ff4d4d;
      box-shadow: 0 16px 32px rgba(255, 0, 51, 0.15);
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #222;
      position: relative;
      overflow: hidden;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.3s;
    }

    .media-card:hover .card-thumb img {
      transform: scale(1.02);
    }

    .type-tag {
      position: absolute;
      bottom: 10px;
      right: 12px;
      background: #0f0f0fcc;
      backdrop-filter: blur(4px);
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      color: #eee;
      border: 1px solid #3a3a3a;
    }

    .card-body {
      padding: 18px 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-title {
      font-weight: 600;
      font-size: 16px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-artist {
      color: #aaa;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-artist i {
      color: #ff4d4d;
    }

    .card-meta {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: #777;
      margin-top: 2px;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      border-top: 1px solid #2a2a2a;
      padding-top: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-download {
      background: #ff0033;
      border: none;
      color: white;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 60px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.2s;
      flex: 1;
      min-width: 60px;
    }

    .btn-download:hover {
      background: #cc0028;
      transform: scale(0.98);
    }

    .btn-download.secondary {
      background: #2a2a2a;
    }

    .btn-download.secondary:hover {
      background: #3a3a3a;
    }

    .btn-download.loading {
      opacity: 0.7;
      pointer-events: none;
    }

    .play-btn {
      background: #1f1f1f;
      border: 1px solid #3a3a3a;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
      flex-shrink: 0;
    }

    .play-btn:hover {
      background: #2f2f2f;
      border-color: #ff0033;
      color: #ff4d4d;
    }

    .play-btn.playing {
      background: #ff0033;
      border-color: #ff0033;
      color: #fff;
    }

    .footer-note {
      margin-top: 38px;
      text-align: center;
      color: #555;
      font-size: 13px;
      border-top: 1px solid #252525;
      padding-top: 26px;
      letter-spacing: 0.2px;
    }

    .loader {
      text-align: center;
      grid-column: 1 / -1;
      padding: 50px 20px;
      color: #888;
      font-size: 16px;
    }

    .loader i {
      font-size: 32px;
      color: #ff4d4d;
      margin-bottom: 12px;
    }

    @media (max-width: 700px) {
      .app-wrapper { padding: 16px; }
      .artist-profile { flex-direction: column; align-items: flex-start; padding: 20px; }
      .artist-stats { margin-left: 0; width: 100%; justify-content: space-around; padding: 8px 12px; }
      .avatar-frame { width: 70px; height: 70px; font-size: 34px; }
      .artist-name { font-size: 22px; }
      .featured-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    }

    @media (max-width: 500px) {
      .top-bar { flex-direction: column; align-items: stretch; }
      .search-box { flex: 1; }
      .logo-text { font-size: 20px; }
    }
  </style>
</head>
<body>
<div class="app-wrapper">

  <div class="top-bar">
    <div class="logo-area">
      <div class="logo-icon"><i class="fab fa-youtube"></i></div>
      <div class="logo-text">SIR BRAVIN<span>DOWNLOADER</span></div>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search songs, artists, videos...">
      <button id="searchBtn"><i class="fas fa-search"></i></button>
    </div>
  </div>

  <div class="artist-profile" id="artistProfile">
    <div class="artist-avatar">
      <div class="avatar-frame" id="avatarIcon"><i class="fas fa-user-astronaut"></i></div>
      <div class="artist-info">
        <div class="artist-name" id="artistName">
          <span>Sir Bravin</span>
          <span class="artist-badge"><i class="fas fa-check-circle"></i> PRO</span>
        </div>
        <div class="artist-sub" id="artistSub">
          <i class="fas fa-headphones-alt"></i> 
          <span id="heroSubText">real sir bravin · music & video downloader</span>
        </div>
      </div>
    </div>
    <div class="artist-stats">
      <div class="stat-item"><i class="fas fa-music"></i> <strong id="statSongs">128</strong> tracks</div>
      <div class="stat-item"><i class="fas fa-video"></i> <strong id="statVideos">42</strong> videos</div>
      <div class="stat-item"><i class="fas fa-download"></i> <strong id="statDownloads">2.4k</strong> downloads</div>
    </div>
  </div>

  <!-- FEATURED ARTISTS SECTION -->
  <div class="section-title" style="margin-top: 10px;"><i class="fas fa-star"></i> Featured Artists</div>
  <div class="featured-grid" id="featuredGrid">
    <!-- will be injected -->
  </div>

  <div class="section-title"><i class="fas fa-list-ul"></i> Results</div>
  <div class="grid" id="mediaGrid">
    <div class="loader"><i class="fas fa-music"></i><br><br>Type a song and press Enter</div>
  </div>

  <div class="footer-note">AURA-BXMD • High quality audio/video • sir bravin downloader</div>
</div>

<script>
  // ===== APIS =====
  const AUDIO_APIS = [
    url => `https://apis.davidcyriltech.my.id/download/ytmp3?url=${encodeURIComponent(url)}`,
    url => `https://www.dark-yasiya-api.site/download/ytmp3?url=${encodeURIComponent(url)}`,
    url => `https://api.dreaded.site/api/ytdl/audio?url=${encodeURIComponent(url)}`
  ];

  const VIDEO_APIS = [
    url => `https://apiziaul.vercel.app/api/downloader/ytmp4?url=${encodeURIComponent(url)}`,
    url => `https://apiziaul.vercel.app/api/downloader/ytmp4?url=${encodeURIComponent(url)}`,
    url => `https://api.dreaded.site/api/ytdl/video?url=${encodeURIComponent(url)}`
  ];

  const SEARCH_APIS = [
    q => `https://apis.davidcyriltech.my.id/youtube/search?query=${encodeURIComponent(q)}`,
    q => `https://www.dark-yasiya-api.site/search/yts?query=${encodeURIComponent(q)}`
  ];

  const grid = document.getElementById('mediaGrid');
  const searchInput = document.getElementById('searchInput');
  const artistName = document.getElementById('artistName');
  const artistSub = document.getElementById('heroSubText');
  const avatarIcon = document.getElementById('avatarIcon');
  const statSongs = document.getElementById('statSongs');
  const statVideos = document.getElementById('statVideos');
  const statDownloads = document.getElementById('statDownloads');

  // ---- audio player manager ----
  let currentAudio = null;
  let currentPlayBtn = null;

  function togglePlay(url, btn, title) {
    if (currentAudio && currentAudio.src !== url) {
      currentAudio.pause();
      if (currentPlayBtn && currentPlayBtn !== btn) {
        currentPlayBtn.classList.remove('playing');
        currentPlayBtn.innerHTML = '<i class="fas fa-play"></i>';
      }
    }

    if (currentAudio && currentAudio.src === url && !currentAudio.paused) {
      currentAudio.pause();
      btn.classList.remove('playing');
      btn.innerHTML = '<i class="fas fa-play"></i>';
      return;
    }

    if (currentAudio && currentAudio.src === url && currentAudio.paused) {
      currentAudio.play();
      btn.classList.add('playing');
      btn.innerHTML = '<i class="fas fa-pause"></i>';
      return;
    }

    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }

    const audio = new Audio(url);
    audio.addEventListener('ended', () => {
      btn.classList.remove('playing');
      btn.innerHTML = '<i class="fas fa-play"></i>';
      currentAudio = null;
      currentPlayBtn = null;
    });
    audio.play().catch(e => {
      alert('Cannot play audio: ' + e.message);
      btn.classList.remove('playing');
      btn.innerHTML = '<i class="fas fa-play"></i>';
    });
    currentAudio = audio;
    currentPlayBtn = btn;
    btn.classList.add('playing');
    btn.innerHTML = '<i class="fas fa-pause"></i>';
  }

  // ---- search ----
  async function searchYouTube(query) {
    grid.innerHTML = `<div class="loader"><i class="fas fa-spinner fa-spin"></i><br><br>Searching YouTube for "${query}"...</div>`;
    for (let apiFn of SEARCH_APIS) {
      try {
        const res = await fetch(apiFn(query));
        const data = await res.json();
        const videos = data.result || data.results || data.videos || data;
        if (Array.isArray(videos) && videos.length > 0) {
          return videos.slice(0, 15);
        }
        if (data.result && Array.isArray(data.result.videos)) return data.result.videos.slice(0, 15);
      } catch(e){ continue; }
    }
    return null;
  }

  // ---- download link ----
  async function getDownloadLink(youtubeUrl, type) {
    const apis = type === 'audio' ? AUDIO_APIS : VIDEO_APIS;
    for (let apiFn of apis) {
      try {
        const res = await fetch(apiFn(youtubeUrl));
        const data = await res.json();
        const r = data.result || data;
        const link = r.download_url || r.downloadUrl || r.url || data.downloadUrl || data.url;
        if (link) return { url: link, title: r.title || 'download' };
      } catch(e){ continue; }
    }
    return null;
  }

  // ---- render cards ----
  function renderCards(videos) {
    if (!videos || videos.length === 0) {
      grid.innerHTML = `<div class="loader"><i class="fas fa-exclamation-circle"></i><br><br>No results found</div>`;
      return;
    }

    const first = videos[0];
    const channelName = first.author?.name || first.channel || first.author || 'YouTube';
    artistName.innerHTML = `<span>${channelName}</span><span class="artist-badge"><i class="fas fa-check-circle"></i> PRO</span>`;
    artistSub.innerText = `${videos.length} results · sir bravin downloader`;
    avatarIcon.innerHTML = `<i class="fas fa-microphone-alt"></i>`;
    statSongs.innerText = videos.filter(v => v.duration).length || videos.length;
    statVideos.innerText = videos.length;
    statDownloads.innerText = Math.floor(Math.random() * 5000 + 500);

    grid.innerHTML = videos.map(v => {
      const thumb = v.thumbnail || v.thumbnails?.[0]?.url || `https://img.youtube.com/vi/${v.videoId || v.id}/hqdefault.jpg`;
      const title = v.title || v.name || 'Untitled';
      const channel = v.author?.name || v.channel || v.author || 'YouTube';
      const duration = v.timestamp || v.duration || v.time || '';
      const videoId = v.videoId || v.id || '';
      const url = v.url || `https://www.youtube.com/watch?v=${videoId}`;

      return `
        <div class="media-card">
          <div class="card-thumb">
            <img src="${thumb}" loading="lazy" alt="thumbnail">
            <span class="type-tag">${duration || '🎵'}</span>
          </div>
          <div class="card-body">
            <div class="card-title">${title}</div>
            <div class="card-artist"><i class="fas fa-user-circle"></i> ${channel}</div>
            <div class="card-meta"><i class="fas fa-link"></i> youtube.com/watch?v=${videoId.slice(0,6)}...</div>
            <div class="card-actions">
              <button class="play-btn" data-url="${url}" data-title="${title}" onclick="handlePlay(this)"><i class="fas fa-play"></i></button>
              <button class="btn-download" onclick="downloadNow('${url}', 'audio', this)"><i class="fas fa-music"></i> MP3</button>
              <button class="btn-download secondary" onclick="downloadNow('${url}', 'video', this)"><i class="fas fa-video"></i> MP4</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  // ---- play handler ----
  async function handlePlay(btn) {
    const youtubeUrl = btn.getAttribute('data-url');
    const title = btn.getAttribute('data-title');
    try {
      const result = await getDownloadLink(youtubeUrl, 'audio');
      if (result && result.url) {
        togglePlay(result.url, btn, title);
      } else {
        const fallback = 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3';
        togglePlay(fallback, btn, title);
      }
    } catch (e) {
      alert('Playback error: ' + e.message);
    }
  }

  // ---- download ----
  async function downloadNow(youtubeUrl, type, btn) {
    const original = btn.innerHTML;
    btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Loading`;
    btn.classList.add('loading');
    try {
      const result = await getDownloadLink(youtubeUrl, type);
      if (!result) throw new Error('Server busy');
      const a = document.createElement('a');
      a.href = result.url;
      a.download = `${result.title}.${type === 'audio' ? 'mp3' : 'mp4'}`;
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      a.remove();
      btn.innerHTML = `<i class="fas fa-check"></i> Done`;
      setTimeout(()=> { btn.innerHTML = original; btn.classList.remove('loading'); }, 2000);
    } catch (e) {
      btn.innerHTML = `<i class="fas fa-times"></i> Failed`;
      alert('Download failed, try another server. Error: ' + e.message);
      setTimeout(()=> { btn.innerHTML = original; btn.classList.remove('loading'); }, 2000);
    }
  }

  // ---- search action ----
  async function doSearch() {
    const q = searchInput.value.trim();
    if (!q) {
      grid.innerHTML = `<div class="loader"><i class="fas fa-info-circle"></i><br><br>Please type a song or artist</div>`;
      return;
    }
    const results = await searchYouTube(q);
    if (results) renderCards(results);
    else grid.innerHTML = `<div class="loader"><i class="fas fa-exclamation-triangle"></i><br><br>API limit reached. Try again later or change keyword.</div>`;
  }

  document.getElementById('searchBtn').addEventListener('click', doSearch);
  searchInput.addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });

  // ---- FEATURED ARTISTS ----
  const featuredArtists = [
    { name: 'Diamond Platnumz', icon: 'fa-gem', color: '#ffd700' },
    { name: 'Zuchu', icon: 'fa-crown', color: '#ff69b4' },
    { name: 'Wakadinali', icon: 'fa-skull', color: '#ff4500' },
    { name: 'Mbosso', icon: 'fa-guitar', color: '#1e90ff' },
    { name: 'Alikiba', icon: 'fa-music', color: '#32cd32' },
    { name: 'Rayvanny', icon: 'fa-microphone', color: '#ff1493' },
    { name: 'Harmonize', icon: 'fa-headphones', color: '#ffa500' },
    { name: 'Koffi Olomide', icon: 'fa-dance', color: '#8a2be2' }
  ];

  const featuredGrid = document.getElementById('featuredGrid');
  featuredGrid.innerHTML = featuredArtists.map(artist => `
    <div class="featured-card">
      <div class="featured-avatar" style="color: ${artist.color};">
        <i class="fas ${artist.icon}"></i>
      </div>
      <div class="featured-name">${artist.name}</div>
      <span class="featured-tag"><i class="fas fa-music"></i> artist</span>
      <button class="featured-play" data-artist="${artist.name}" onclick="playFeatured(this, '${artist.name}')">
        <i class="fas fa-play"></i>
      </button>
    </div>
  `).join('');

  // featured play (dummy preview)
  function playFeatured(btn, name) {
    const dummyUrl = 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3';
    togglePlay(dummyUrl, btn, name);
  }

  statSongs.innerText = '128';
  statVideos.innerText = '42';
  statDownloads.innerText = '2.4k';
</script>
