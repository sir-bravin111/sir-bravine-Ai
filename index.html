<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sir bravin · music & video</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }

    body {
      background: #0b0b0b;
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 20px 48px;
    }

    .app-wrapper {
      max-width: 1280px;
      width: 100%;
      background: #121212;
      border-radius: 36px;
      padding: 28px 32px 32px;
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.9);
      border: 1px solid #2a2a2a;
      backdrop-filter: blur(2px);
      transition: all 0.2s ease;
    }

    /* ===== TOP BAR ===== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px 18px;
      padding-bottom: 22px;
      border-bottom: 1px solid #2a2a2a;
      margin-bottom: 30px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-icon {
      font-size: 34px;
      color: #ff0033;
      background: #1a1a1a;
      padding: 6px 12px;
      border-radius: 60px;
      box-shadow: 0 0 0 1px #333, 0 8px 16px rgba(255, 0, 51, 0.15);
      transition: 0.2s;
    }

    .logo-icon i {
      filter: drop-shadow(0 0 6px rgba(255, 0, 51, 0.4));
    }

    .logo-text {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ff0033, #ff4d4d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-text span {
      font-weight: 300;
      -webkit-text-fill-color: #a0a0a0;
      margin-left: 4px;
      font-size: 18px;
    }

    .search-box {
      flex: 1 1 340px;
      display: flex;
      align-items: center;
      background: #1e1e1e;
      border-radius: 60px;
      padding: 0 8px 0 24px;
      border: 1px solid #333;
      transition: 0.25s cubic-bezier(0.2, 0, 0, 1);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .search-box:focus-within {
      border-color: #ff0033;
      box-shadow: 0 0 0 3px rgba(255, 0, 51, 0.25), inset 0 2px 4px rgba(0, 0, 0, 0.4);
      background: #1a1a1a;
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 14px 8px;
      color: #f1f1f1;
      font-size: 16px;
      outline: none;
      min-width: 120px;
      font-weight: 400;
    }

    .search-box input::placeholder {
      color: #777;
      font-weight: 300;
    }

    .search-box button {
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 20px;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 60px;
      transition: 0.2s;
    }

    .search-box button:hover {
      color: #fff;
      background: #2c2c2c;
    }

    /* ===== HERO ===== */
    .hero-section {
      display: flex;
      flex-wrap: wrap;
      gap: 20px 32px;
      background: #1c1c1c;
      border-radius: 32px;
      padding: 20px 28px;
      margin-bottom: 36px;
      border: 1px solid #2c2c2c;
      align-items: center;
      box-shadow: inset 0 2px 0 #2a2a2a;
    }

    .artist-card {
      display: flex;
      align-items: center;
      gap: 18px;
      flex: 1 1 200px;
    }

    .artist-picture {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(145deg, #2a2a2a, #151515);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      color: #ff4d4d;
      border: 2px solid #3a3a3a;
      flex-shrink: 0;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    }

    .hero-text {
      display: flex;
      flex-direction: column;
    }

    .hero-text .name {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.2px;
      background: linear-gradient(135deg, #f1f1f1, #ccc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-text .sub {
      font-size: 13px;
      color: #999;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hero-text .sub i {
      color: #ff0033;
      font-size: 12px;
    }

    /* ===== SECTION TITLE ===== */
    .section-title {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-left: 5px solid #ff0033;
      padding-left: 18px;
      letter-spacing: -0.3px;
    }

    .section-title i {
      color: #ff0033;
      font-size: 22px;
    }

    /* ===== GRID ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 28px 24px;
      margin-top: 8px;
    }

    .media-card {
      background: #1a1a1a;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid #2a2a2a;
      transition: 0.3s cubic-bezier(0.2, 0, 0, 1);
      display: flex;
      flex-direction: column;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
    }

    .media-card:hover {
      transform: translateY(-8px);
      border-color: #ff4d4d;
      box-shadow: 0 18px 36px rgba(255, 0, 51, 0.18);
      background: #1f1f1f;
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #252525;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid #2a2a2a;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.3s;
    }

    .media-card:hover .card-thumb img {
      transform: scale(1.02);
    }

    .type-tag {
      position: absolute;
      bottom: 12px;
      right: 14px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 12px;
      font-weight: 600;
      color: #eee;
      border: 1px solid #444;
      letter-spacing: 0.3px;
    }

    .card-body {
      padding: 18px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .card-title {
      font-weight: 600;
      font-size: 16px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: #f1f1f1;
    }

    .card-artist {
      color: #aaa;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .card-artist i {
      color: #777;
      font-size: 12px;
    }

    .card-meta {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: #777;
      margin-top: 2px;
      align-items: center;
    }

    .card-meta i {
      font-size: 11px;
      color: #555;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      border-top: 1px solid #2c2c2c;
      padding-top: 16px;
      flex-wrap: wrap;
    }

    .btn-download {
      background: #ff0033;
      border: none;
      color: white;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 60px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.2s;
      flex: 1 1 auto;
      min-width: 80px;
      box-shadow: 0 4px 12px rgba(255, 0, 51, 0.2);
    }

    .btn-download:hover {
      background: #cc0028;
      transform: scale(0.97);
      box-shadow: 0 6px 16px rgba(255, 0, 51, 0.3);
    }

    .btn-download.secondary {
      background: #2a2a2a;
      box-shadow: none;
    }

    .btn-download.secondary:hover {
      background: #3d3d3d;
    }

    .btn-download.loading {
      opacity: 0.7;
      pointer-events: none;
      filter: grayscale(0.3);
    }

    .btn-download i {
      font-size: 14px;
    }

    .footer-note {
      margin-top: 40px;
      text-align: center;
      color: #555;
      font-size: 13px;
      border-top: 1px solid #252525;
      padding-top: 26px;
      letter-spacing: 0.5px;
    }

    .footer-note i {
      color: #ff0033;
      margin: 0 6px;
    }

    .loader {
      text-align: center;
      grid-column: 1 / -1;
      padding: 50px 20px;
      color: #888;
      font-size: 15px;
      background: #181818;
      border-radius: 40px;
      border: 1px dashed #333;
    }

    .loader i {
      font-size: 40px;
      color: #ff0033;
      margin-bottom: 12px;
      display: block;
    }

    /* responsive touch */
    @media (max-width: 640px) {
      .app-wrapper {
        padding: 16px 14px 24px;
      }
      .top-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .search-box {
        flex: 1 1 auto;
      }
      .hero-section {
        padding: 16px 18px;
      }
      .artist-picture {
        width: 60px;
        height: 60px;
        font-size: 28px;
      }
      .logo-text {
        font-size: 20px;
      }
      .logo-text span {
        font-size: 14px;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      .card-actions {
        flex-direction: row;
      }
      .btn-download {
        flex: 1;
      }
    }
  </style>
</head>
<body>
<div class="app-wrapper">

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="logo-area">
      <div class="logo-icon"><i class="fab fa-youtube"></i></div>
      <div class="logo-text">SIR BRAVIN<span>DOWNLOADER</span></div>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search songs, artists, videos...">
      <button id="searchBtn" aria-label="Search"><i class="fas fa-search"></i></button>
    </div>
  </div>

  <!-- HERO -->
  <div class="hero-section">
    <div class="artist-card">
      <div class="artist-picture"><i class="fas fa-fire"></i></div>
      <div class="hero-text">
        <div class="name" id="heroArtist">Search anything</div>
        <div class="sub"><i class="fas fa-circle" style="color:#ff0033; font-size:8px;"></i> sir bravin · real downloader</div>
      </div>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="section-title"><i class="fas fa-headphones-alt"></i> Results</div>
  <div class="grid" id="mediaGrid">
    <div class="loader"><i class="fas fa-music"></i> Type a song and press Enter</div>
  </div>

  <div class="footer-note"><i class="fas fa-bolt"></i> AURA-BXMD · high quality audio/video <i class="fas fa-bolt"></i></div>
</div>

<script>
  // ===== APIS (same as yours, with your new API) =====
  const AUDIO_APIS = [
    url => `https://apiziaul.vercel.app/api/downloader/ytmp4?url=${encodeURIComponent(url)}`,
    url => `https://apis.davidcyriltech.my.id/download/ytmp3?url=${encodeURIComponent(url)}`,
    url => `https://www.dark-yasiya-api.site/download/ytmp3?url=${encodeURIComponent(url)}`,
    url => `https://api.dreaded.site/api/ytdl/audio?url=${encodeURIComponent(url)}`
  ];

  const VIDEO_APIS = [
    url => `https://apiziaul.vercel.app/api/downloader/ytmp4?url=${encodeURIComponent(url)}`,
    url => `https://apis.davidcyriltech.my.id/download/ytmp4?url=${encodeURIComponent(url)}`,
    url => `https://www.dark-yasiya-api.site/download/ytmp4?url=${encodeURIComponent(url)}`,
    url => `https://api.dreaded.site/api/ytdl/video?url=${encodeURIComponent(url)}`
  ];

  const SEARCH_APIS = [
    q => `https://apis.davidcyriltech.my.id/youtube/search?query=${encodeURIComponent(q)}`,
    q => `https://www.dark-yasiya-api.site/search/yts?query=${encodeURIComponent(q)}`
  ];

  const grid = document.getElementById('mediaGrid');
  const searchInput = document.getElementById('searchInput');
  const heroArtist = document.getElementById('heroArtist');

  // ===== SEARCH =====
  async function searchYouTube(query) {
    grid.innerHTML = `<div class="loader"><i class="fas fa-spinner fa-spin"></i><br>Searching for "${query}" ...</div>`;
    for (let apiFn of SEARCH_APIS) {
      try {
        const res = await fetch(apiFn(query));
        const data = await res.json();
        let videos = data.result || data.results || data.videos || data;
        if (Array.isArray(videos) && videos.length > 0) return videos.slice(0, 16);
        if (data.result && Array.isArray(data.result.videos)) return data.result.videos.slice(0, 16);
      } catch (e) { continue; }
    }
    return null;
  }

  // ===== DOWNLOAD LINK =====
  async function getDownloadLink(youtubeUrl, type) {
    const apis = type === 'audio' ? AUDIO_APIS : VIDEO_APIS;
    for (let apiFn of apis) {
      try {
        const res = await fetch(apiFn(youtubeUrl));
        const data = await res.json();
        console.log('API response:', data);
        const r = data.result || data.data || data;
        const link = r.download_url || r.downloadUrl || r.url || r.dl_url || r.link || data.download_url || data.url || data.downloadUrl;
        if (link) return { url: link, title: r.title || r.judul || 'sir-bravin-download' };
      } catch (e) { continue; }
    }
    return null;
  }

  // ===== RENDER =====
  function renderCards(videos) {
    if (!videos || videos.length === 0) {
      grid.innerHTML = `<div class="loader"><i class="fas fa-exclamation-triangle"></i><br>No results found</div>`;
      return;
    }
    const first = videos[0];
    heroArtist.innerText = first.author?.name || first.channel || 'YouTube Results';

    grid.innerHTML = videos.map(v => {
      const thumb = v.thumbnail || v.thumbnails?.[0]?.url || `https://img.youtube.com/vi/${v.videoId || v.id}/hqdefault.jpg`;
      const title = v.title || v.name || 'Untitled';
      const channel = v.author?.name || v.channel || v.author || 'YouTube';
      const duration = v.timestamp || v.duration || v.time || '';
      const videoId = v.videoId || v.id || '';
      const url = v.url || `https://www.youtube.com/watch?v=${videoId}`;

      return `
        <div class="media-card">
          <div class="card-thumb">
            <img src="${thumb}" loading="lazy" alt="thumbnail">
            <span class="type-tag">${duration || '▶'}</span>
          </div>
          <div class="card-body">
            <div class="card-title">${title}</div>
            <div class="card-artist"><i class="fas fa-user-circle"></i> ${channel}</div>
            <div class="card-meta"><i class="fas fa-link"></i> youtube.com/watch?v=${videoId.slice(0,6)}...</div>
            <div class="card-actions">
              <button class="btn-download" onclick="downloadNow('${url}', 'audio', this)"><i class="fas fa-music"></i> MP3</button>
              <button class="btn-download secondary" onclick="downloadNow('${url}', 'video', this)"><i class="fas fa-video"></i> MP4</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  // ===== DOWNLOAD ACTION =====
  async function downloadNow(youtubeUrl, type, btn) {
    const original = btn.innerHTML;
    btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Loading`;
    btn.classList.add('loading');
    try {
      const result = await getDownloadLink(youtubeUrl, type);
      if (!result) throw new Error('Server busy');

      const a = document.createElement('a');
      a.href = result.url;
      a.download = `${result.title}.${type === 'audio' ? 'mp3' : 'mp4'}`;
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      a.remove();

      btn.innerHTML = `<i class="fas fa-check"></i> Done`;
      setTimeout(() => { btn.innerHTML = original; btn.classList.remove('loading'); }, 2500);
    } catch (e) {
      btn.innerHTML = `<i class="fas fa-times"></i> Failed`;
      alert('Download failed, trying next server...');
      setTimeout(() => { btn.innerHTML = original; btn.classList.remove('loading'); }, 2000);
    }
  }

  // ===== SEARCH TRIGGER =====
  async function doSearch() {
    const q = searchInput.value.trim();
    if (!q) {
      grid.innerHTML = `<div class="loader"><i class="fas fa-info-circle"></i><br>Please enter a search term</div>`;
      return;
    }
    const results = await searchYouTube(q);
    if (results) renderCards(results);
    else grid.innerHTML = `<div class="loader"><i class="fas fa-satellite-dish"></i><br>API limit reached. Try again later.</div>`;
  }

  document.getElementById('searchBtn').addEventListener('click', doSearch);
  searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

  // welcome placeholder – trigger search on load with a default query? (optional)
  // but we keep it clean.
</script>
</body>
</html>
