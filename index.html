<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sir bravin music</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial,sans-serif}
    body{background:#0f0f0f;color:#f1f1f1;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px 16px 40px}
    .app-wrapper{max-width:1200px;width:100%;background:#181818;border-radius:32px;padding:24px 28px 32px;box-shadow:0 20px 40px rgba(0,0,0,0.8);border:1px solid #2a2a2a}
    .top-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px 12px;padding-bottom:20px;border-bottom:1px solid #2a2a2a;margin-bottom:28px}
    .logo-area{display:flex;align-items:center;gap:10px}
    .logo-icon{font-size:32px;color:#ff0033}
    .logo-text{font-size:24px;font-weight:700}
    .logo-text span{font-weight:300;color:#aaa}
    .search-box{flex:1 1 320px;display:flex;align-items:center;background:#222;border-radius:40px;padding:0 6px 0 20px;border:1px solid #3a3a3a}
    .search-box input{flex:1;background:transparent;border:none;padding:14px 6px;color:#f1f1f1;font-size:16px;outline:none}
    .search-box button{background:transparent;border:none;color:#aaa;font-size:20px;padding:10px 18px;cursor:pointer}

    /* NEW YOUTUBE FEED STYLE */
    .grid{display:flex;flex-direction:column;gap:20px;margin-top:6px}
    .media-card{background:transparent;border:none;display:flex;flex-direction:column;cursor:pointer}
    .card-thumb{width:100%;aspect-ratio:16/9;background:#222;position:relative;overflow:hidden;border-radius:16px}
    .card-thumb img{width:100%;height:100%;object-fit:cover}
    .duration-badge{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.85);padding:3px 7px;border-radius:6px;font-size:12px;font-weight:500}
    .card-info{display:flex;gap:12px;padding:12px 4px 6px}
    .channel-avatar{width:40px;height:40px;border-radius:50%;background:#2a2a2a;flex-shrink:0;overflow:hidden;border:1px solid #333}
    .channel-avatar img{width:100%;height:100%;object-fit:cover}
    .card-text{flex:1;min-width:0}
    .card-title{font-weight:600;font-size:17px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .card-artist{color:#aaa;font-size:14px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card-meta{color:#888;font-size:13px;margin-top:2px}
    .section-title{font-size:20px;font-weight:500;margin-bottom:18px;display:flex;align-items:center;gap:12px;border-left:4px solid #ff0033;padding-left:16px}
    .footer-note{margin-top:32px;text-align:center;color:#555;font-size:13px;border-top:1px solid #252525;padding-top:22px}
    .loader{text-align:center;padding:40px;color:#888}
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="top-bar">
    <div class="logo-area">
      <div class="logo-icon"><i class="fab fa-youtube"></i></div>
      <div class="logo-text">SIR BRAVIN<span> MUSIC</span></div>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search songs, artists, videos...">
      <button id="searchBtn"><i class="fas fa-search"></i></button>
    </div>
  </div>
  <div class="section-title"><i class="fas fa-headphones-alt"></i> Results</div>
  <div class="grid" id="mediaGrid">
    <div class="loader">Type a song and press Enter</div>
  </div>
  <div class="footer-note">SIR BRAVIN • YouTube Style UI</div>
</div>

<script>
  const grid = document.getElementById('mediaGrid');
  const searchInput = document.getElementById('searchInput');

  // Use official YouTube Data API v3 for lawful results
  // Get key from console.cloud.google.com and put it here
  const YT_API_KEY = 'YOUR_YOUTUBE_API_KEY_HERE';

  async function searchYouTube(query){
    grid.innerHTML = `<div class="loader"><i class="fas fa-spinner fa-spin"></i><br><br>Searching "${query}"...</div>`;
    try{
      const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=12&q=${encodeURIComponent(query)}&key=${YT_API_KEY}`);
      const data = await res.json();
      return data.items || [];
    }catch(e){ return []; }
  }

  function renderCards(videos){
    if(!videos.length){ grid.innerHTML = `<div class="loader">No results found</div>`; return; }
    
    grid.innerHTML = videos.map(v => {
      const videoId = v.id.videoId;
      const snippet = v.snippet;
      const title = snippet.title;
      const channel = snippet.channelTitle;
      const thumb = snippet.thumbnails.high.url;
      // Channel avatar - YouTube API needs second call for real avatar, we use placeholder with first letter like your screenshot's TA logo
      const avatarLetter = channel.charAt(0).toUpperCase();
      const channelThumb = snippet.thumbnails.default.url; // using video thumb as fallback, replace with channel API call if you want

      return `
        <div class="media-card" onclick="window.open('https://www.youtube.com/watch?v=${videoId}','_blank')">
          <div class="card-thumb">
            <img src="${thumb}" loading="lazy">
            <span class="duration-badge">▶ Watch</span>
          </div>
          <div class="card-info">
            <div class="channel-avatar">
              <img src="${channelThumb}" alt="${channel}" onerror="this.style.display='none'; this.parentElement.innerText='${avatarLetter}'" >
            </div>
            <div class="card-text">
              <div class="card-title">${title}</div>
              <div class="card-artist">${channel}</div>
              <div class="card-meta">${new Date(snippet.publishedAt).toDateString()} • YouTube</div>
            </div>
            <i class="fas fa-ellipsis-v" style="color:#888;padding:4px 10px"></i>
          </div>
        </div>`;
    }).join('');
  }

  async function doSearch(){
    const q = searchInput.value.trim();
    if(!q) return;
    if(YT_API_KEY.includes('YOUR_')){ grid.innerHTML = `<div class="loader">Add your YouTube Data API key in code to make search work.<br>Get it free from Google Cloud Console.</div>`; return; }
    const results = await searchYouTube(q);
    renderCards(results);
  }

  document.getElementById('searchBtn').addEventListener('click', doSearch);
  searchInput.addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });
</script>
</body>
</html>
