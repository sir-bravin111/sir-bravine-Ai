<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ Sir Bravin · Shining Legacy</title>
  <!-- Font Awesome for icons (optional but loved) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0d15;
      color: #f0f3fa;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* ===== SHINING BACKGROUND – SIR BRAVIN’S GLOW ===== */
    .shining-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 20% 30%, rgba(255, 215, 100, 0.08) 0%, transparent 40%),
                  radial-gradient(circle at 80% 70%, rgba(255, 200, 80, 0.10) 0%, transparent 45%),
                  radial-gradient(circle at 40% 80%, rgba(255, 180, 50, 0.06) 0%, transparent 50%);
      animation: shimmerFloat 12s infinite alternate ease-in-out;
    }

    .shining-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(45deg, 
        rgba(255, 215, 0, 0.02) 0px, 
        rgba(255, 215, 0, 0.02) 2px,
        transparent 2px,
        transparent 8px);
      background-size: 40px 40px;
      animation: shineMove 20s linear infinite;
      opacity: 0.5;
    }

    /* glowing orbs – "Sir Bravin" signature shine */
    .glow-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
      animation: orbPulse 8s infinite alternate ease-in-out;
    }

    .orb1 {
      width: 500px;
      height: 500px;
      top: -150px;
      left: -150px;
      background: #f9c74f;
      animation-delay: 0s;
    }

    .orb2 {
      width: 600px;
      height: 600px;
      bottom: -200px;
      right: -200px;
      background: #f8961e;
      animation-delay: 2s;
      opacity: 0.2;
    }

    .orb3 {
      width: 400px;
      height: 400px;
      top: 40%;
      left: 60%;
      background: #f9d371;
      animation-delay: 4s;
      opacity: 0.15;
    }

    /* ===== MAIN CARD ===== */
    .hero-card {
      position: relative;
      z-index: 10;
      max-width: 900px;
      width: 100%;
      background: rgba(18, 22, 33, 0.65);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border-radius: 3.5rem;
      padding: 3rem 2.5rem;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 215, 0, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.2);
      transition: transform 0.25s ease, box-shadow 0.4s;
      text-align: center;
    }

    .hero-card:hover {
      transform: scale(1.01) translateY(-4px);
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(255, 215, 0, 0.3);
    }

    /* ===== SIR BRAVIN TYPOGRAPHY ===== */
    .sir-bravin-glow {
      font-size: 3.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #f9e0a0, #f7c948, #f9b82e, #f7c948);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: goldShine 5s ease-in-out infinite alternate;
      text-shadow: 0 0 30px rgba(255, 200, 50, 0.3);
      margin-bottom: 0.5rem;
      line-height: 1.2;
    }

    .sir-bravin-glow i {
      color: #f7c948;
      background: none;
      -webkit-background-clip: unset;
      background-clip: unset;
      text-shadow: 0 0 20px #f7b32b;
      margin: 0 0.2rem;
    }

    .sub-bravin {
      font-size: 1.4rem;
      font-weight: 300;
      letter-spacing: 6px;
      color: #e8d5b0;
      text-transform: uppercase;
      border-top: 1px solid rgba(255, 215, 0, 0.2);
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
      display: inline-block;
      padding: 0.5rem 1.8rem;
      margin-bottom: 1.8rem;
      backdrop-filter: blur(4px);
      background: rgba(255, 215, 0, 0.04);
      border-radius: 60px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
    }

    .description {
      font-size: 1.2rem;
      line-height: 1.7;
      color: #d6dcec;
      max-width: 600px;
      margin: 1.5rem auto;
      font-weight: 300;
      background: rgba(0, 0, 0, 0.2);
      padding: 1.2rem 2rem;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 215, 0, 0.08);
    }

    .description i {
      color: #f7c948;
      margin: 0 0.3rem;
    }

    .btn-shine {
      display: inline-block;
      background: linear-gradient(145deg, #f7c948, #e6a820);
      border: none;
      padding: 1rem 2.8rem;
      border-radius: 60px;
      font-size: 1.3rem;
      font-weight: 700;
      color: #141a26;
      letter-spacing: 1px;
      box-shadow: 0 8px 28px rgba(247, 201, 72, 0.3);
      transition: all 0.25s ease;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.3);
      text-decoration: none;
      margin-top: 0.8rem;
    }

    .btn-shine i {
      margin-right: 10px;
      color: #1f1f2a;
    }

    .btn-shine:hover {
      transform: scale(1.05) translateY(-3px);
      box-shadow: 0 14px 40px rgba(247, 201, 72, 0.5);
      background: linear-gradient(145deg, #fad05a, #f0b82a);
      color: #0a0c14;
    }

    /* ===== SOCIAL / LOVED BY MANY ===== */
    .love-section {
      margin-top: 2.8rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1rem 2.5rem;
    }

    .love-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      color: #c8d0e0;
      background: rgba(0, 0, 0, 0.25);
      padding: 0.5rem 1.2rem;
      border-radius: 50px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 215, 0, 0.08);
      transition: 0.2s;
    }

    .love-item i {
      color: #f7c948;
      font-size: 1.3rem;
    }

    .love-item:hover {
      background: rgba(247, 201, 72, 0.12);
      border-color: rgba(247, 201, 72, 0.3);
      transform: translateY(-2px);
    }

    .signature {
      margin-top: 2rem;
      font-size: 1rem;
      letter-spacing: 2px;
      color: #a8b2cc;
      font-weight: 300;
      border-top: 1px solid rgba(255, 215, 0, 0.1);
      padding-top: 1.8rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .signature i {
      color: #f7c948;
      animation: sparkle 2.4s infinite alternate;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes goldShine {
      0% { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }

    @keyframes shimmerFloat {
      0% { opacity: 0.7; transform: scale(1) rotate(0deg); }
      100% { opacity: 1; transform: scale(1.08) rotate(2deg); }
    }

    @keyframes shineMove {
      0% { transform: translateX(-20px) translateY(-10px); }
      100% { transform: translateX(20px) translateY(10px); }
    }

    @keyframes orbPulse {
      0% { opacity: 0.15; transform: scale(1) translate(0, 0); }
      100% { opacity: 0.35; transform: scale(1.2) translate(10px, -10px); }
    }

    @keyframes sparkle {
      0% { opacity: 0.5; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 650px) {
      .hero-card {
        padding: 2rem 1.2rem;
        border-radius: 2.5rem;
      }
      .sir-bravin-glow {
        font-size: 2.8rem;
      }
      .sub-bravin {
        font-size: 1rem;
        letter-spacing: 3px;
        padding: 0.3rem 1.2rem;
      }
      .description {
        font-size: 1rem;
        padding: 1rem;
      }
      .btn-shine {
        padding: 0.8rem 2rem;
        font-size: 1.1rem;
      }
      .love-section {
        gap: 0.8rem;
      }
      .love-item {
        font-size: 0.95rem;
        padding: 0.4rem 1rem;
      }
    }

    @media (max-width: 420px) {
      .sir-bravin-glow {
        font-size: 2.2rem;
      }
      .sub-bravin {
        font-size: 0.8rem;
        letter-spacing: 2px;
      }
    }
  </style>
</head>
<body>
  <!-- SHINING BACKGROUND – dedicated to Sir Bravin -->
  <div class="shining-bg"></div>
  <div class="glow-orb orb1"></div>
  <div class="glow-orb orb2"></div>
  <div class="glow-orb orb3"></div>

  <!-- MAIN CONTENT -->
  <main class="hero-card">
    <!-- SIR BRAVIN signature shine -->
    <h1 class="sir-bravin-glow">
      <i class="fas fa-crown"></i> 
      Sir Bravin 
      <i class="fas fa-star"></i>
    </h1>
    <div class="sub-bravin">
      <i class="fas fa-bolt"></i>  shining legacy  <i class="fas fa-bolt"></i>
    </div>

    <p class="description">
      <i class="fas fa-quote-left"></i> 
      A radiant presence, loved by many — 
      <strong style="color: #f7c948;">Sir Bravin</strong> brings light, warmth, and 
      <i class="fas fa-heart" style="color: #f76b6b;"></i> inspiration. 
      <i class="fas fa-quote-right"></i>
    </p>

    <!-- call to action / interaction -->
    <a href="#" class="btn-shine" id="loveBtn">
      <i class="fas fa-hand-sparkles"></i> Shine with us
    </a>

    <!-- loved by many section -->
    <div class="love-section">
      <span class="love-item"><i class="fas fa-user-group"></i> 2.4k+ admirers</span>
      <span class="love-item"><i class="fas fa-heart" style="color: #f76b6b;"></i> 1.8k loves</span>
      <span class="love-item"><i class="fas fa-fire"></i> trending</span>
      <span class="love-item"><i class="fas fa-comment"></i> 312+ praises</span>
    </div>

    <!-- signature / footer -->
    <div class="signature">
      <i class="fas fa-sun"></i>
      <span>shining with Sir Bravin · forever radiant</span>
      <i class="fas fa-moon"></i>
    </div>
  </main>

  <script>
    (function() {
      // Interactive shine effect – makes the page feel alive and loved
      const btn = document.getElementById('loveBtn');
      const card = document.querySelector('.hero-card');
      const body = document.body;

      // sparkle burst on button click
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        // create multiple tiny sparkles
        for (let i = 0; i < 18; i++) {
          const spark = document.createElement('div');
          spark.style.position = 'fixed';
          spark.style.width = '10px';
          spark.style.height = '10px';
          spark.style.background = `radial-gradient(circle, #f9d371, #f7b32b)`;
          spark.style.borderRadius = '50%';
          spark.style.pointerEvents = 'none';
          spark.style.zIndex = '999';
          spark.style.boxShadow = '0 0 30px #f7c948';
          spark.style.opacity = '0.9';

          // random position around the button
          const rect = btn.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const angle = Math.random() * 2 * Math.PI;
          const radius = 30 + Math.random() * 120;
          const x = cx + Math.cos(angle) * radius;
          const y = cy + Math.sin(angle) * radius - 20;
          spark.style.left = x + 'px';
          spark.style.top = y + 'px';

          // random size
          const size = 4 + Math.random() * 14;
          spark.style.width = size + 'px';
          spark.style.height = size + 'px';

          document.body.appendChild(spark);

          // animate & remove
          const duration = 600 + Math.random() * 600;
          spark.animate([
            { transform: 'scale(0.3) rotate(0deg)', opacity: 0.9 },
            { transform: `scale(1.6) rotate(${Math.random() * 360}deg) translateY(-40px)`, opacity: 0 }
          ], {
            duration: duration,
            easing: 'ease-out',
            fill: 'forwards'
          });

          setTimeout(() => {
            if (spark.parentNode) spark.remove();
          }, duration + 100);
        }

        // also pulse the card
        card.style.transition = 'transform 0.15s ease, box-shadow 0.3s';
        card.style.transform = 'scale(0.98)';
        card.style.boxShadow = '0 0 60px rgba(247, 201, 72, 0.6)';
        setTimeout(() => {
          card.style.transform = 'scale(1.01)';
          card.style.boxShadow = '0 30px 80px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(255, 215, 0, 0.4)';
        }, 120);
        setTimeout(() => {
          card.style.transform = '';
          card.style.boxShadow = '';
        }, 500);
      });

      // extra "shining" interactive: move mouse = subtle glow shift
      document.addEventListener('mousemove', function(e) {
        const x = e.clientX / window.innerWidth;
        const y = e.clientY / window.innerHeight;
        const bg = document.querySelector('.shining-bg');
        if (bg) {
          bg.style.background = `
            radial-gradient(circle at ${x * 100}% ${y * 100}%, rgba(255, 215, 100, 0.12) 0%, transparent 50%),
            radial-gradient(circle at ${(1 - x) * 100}% ${(1 - y) * 100}%, rgba(255, 200, 80, 0.08) 0%, transparent 45%),
            radial-gradient(circle at ${(x * 50 + 20)}% ${(y * 50 + 20)}%, rgba(255, 180, 50, 0.05) 0%, transparent 50%)
          `;
        }
      });
    })();
  </script>
</body>
</html>
